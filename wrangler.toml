name = "kiur-99"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Serve the SPA documents and future same-origin ES modules from the Worker.
# `src/routes/static.ts` already uses this binding and falls back to text
# imports in test environments where Worker Assets is unavailable.
[assets]
directory = "./public"
binding = "ASSETS"

# Cloudflare D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "kiur-99-db"
database_id = "89fbb990-643f-4727-b71b-99733e65593a"
migrations_dir = "migrations"

# Import rule for raw HTML files as text modules
[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true

# Environment Variables ([vars] accessible via c.env)
[vars]
DEBUG = "false"
# Production JWT_SECRET must be configured securely via `wrangler secret put JWT_SECRET`.
# Never store production secrets in plaintext in version control.
JWT_ALGORITHM = "HS256"
JWT_EXPIRES_MINUTES = "20160"
BOOTSTRAP_ADMIN_EMAIL = "hussein2004810@gmail.com"
# Set production front-end origins as a comma-separated Cloudflare secret or
# environment variable.  Wildcards are rejected by the production validator.
CORS_ORIGINS = ""
ALLOWED_UNIVERSITY_DOMAINS = ""
FRONTEND_URL = ""
ADMIN_FRONTEND_URL = ""
GOOGLE_CLIENT_ID = ""
GOOGLE_CLIENT_SECRET = ""
GOOGLE_REDIRECT_URI = ""
PASSWORD_RESET_TTL_MINUTES = "60"
PASSWORD_RESET_COOLDOWN_SECONDS = "120"
SMTP_HOST = ""
SMTP_PORT = "587"
SMTP_USER = ""
SMTP_PASSWORD = ""
SMTP_FROM = "no-reply@kiur.edu"
SMTP_FROM_NAME = "Kiur"
